<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetGo API</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>GadgetGo E-Commerce API</h1>
        <p class="subtitle">RESTful API for managing products, users, and orders.</p>

        <div class="section">
            <h2>API Information</h2>
            <p><strong>Base URL:</strong> {{ request.host_url }}/</p>
            <p><strong>Version:</strong> v1</p>
            <p><strong>Status:</strong> Running</p>
        </div>

        <div class="section">
            <h2>Available Endpoints</h2>

            <div class="endpoint">
                <span class="method get">GET</span>
                <a href="/v1/about">/v1/about</a>
                <span class="description">API information</span>
            </div>

            <!-- Add more endpoints below -->
            <!--
            <div class="endpoint">
                <span class="method post">POST</span>
                <span>/v1/products</span>
                <span class="description">Create a product</span>
            </div>
            -->
        </div>

        <div class="footer">
            © {{ year }} GadgetGo API
        </div>
    </div>
</body>
</html>
